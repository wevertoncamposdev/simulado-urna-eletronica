# Simula o deploy de produção localmente: dois containers isolados, comunicando só
# por HTTP (como no Railway), com os dados do backend num volume nomeado. Não é
# usado pelo Railway (cada serviço lá usa só o Dockerfile correspondente) — é
# só pra testar a imagem antes de subir.
#
# Uso:
#   docker compose up --build
#   backend:  http://localhost:3000/api/health
#   frontend: http://localhost:8080
services:
  backend:
    build: ./backend
    ports:
      - "3000:3000"
    environment:
      NODE_ENV: production
      JWT_SECRET: ${JWT_SECRET:-troque-este-valor-antes-de-usar-de-verdade}
      FRONTEND_URL: http://localhost:8080
      DATA_PATH: /app/data
    volumes:
      - backend-data:/app/data
    restart: unless-stopped

  frontend:
    build:
      context: ./frontend
      args:
        VITE_API_URL: http://localhost:3000
    ports:
      - "8080:80"
    depends_on:
      - backend
    restart: unless-stopped

volumes:
  backend-data:
